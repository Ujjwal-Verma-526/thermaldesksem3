<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Syllabus-mapped study desk for Thermal Engineering: compressors, gas power cycles, IC engines, gas turbines and jet propulsion." />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M20 19C13 18.5 8 15 6 11L6 4C9 8.5 14 12.5 20 14Z' fill='%23fbe9e0' stroke='%23c2410c' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <title>Thermal Desk</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var saved = JSON.parse(localStorage.getItem('thermal-desk:v1') || '{}').theme
        if (saved === 'light' || saved === 'dark') document.documentElement.dataset.theme = saved
      } catch (e) {
        /* storage unavailable: fall back to the system theme */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
